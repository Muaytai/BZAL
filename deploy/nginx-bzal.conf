# =============================================================================
# Конфигурация Nginx для портала Технопарка ОАО «БЗАЛ»
# Путь на сервере: /etc/nginx/sites-available/bzal.conf
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bzal.by www.bzal.by technopark.bzal.by _;

    # Лимит загрузки чертежей ЕСКД (.pdf, .step, .dwg, .zip) и фото CMS — до 50 МБ
    client_max_body_size 50M;

    # Сжатие ответов для максимальной скорости загрузки
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Заголовки безопасности (Указ Президента РБ № 60)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
