version: '3.9'

services:
  bzal-portal:
    container_name: technopark-bzal-portal
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Сохранение локальной базы заявок и настроек CMS при перезапусках/обновлениях
      - ./data:/app/data
      # Сохранение загруженных через CMS фотографий
      - ./public/images/uploads:/app/public/images/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
